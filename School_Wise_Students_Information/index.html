<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Wise Students Information</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #000000;
            --text: #1a1a1a;
            --muted: #555555;
            --border: #000000;
            --accent: #14532d;
            --accent-light: #f0f5f1;
            --bg: #f2f2f2;
            --error: #b00000;
            --error-bg: #fdecec;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 30px 16px;
        }

        .sheet {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #999;
            padding: 30px 36px 40px;
        }

        /* ---------- Header ---------- */
        .doc-header {
            text-align: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 14px;
            margin-bottom: 24px;
        }
        .doc-header h1 {
            font-family: 'Noto Serif', serif;
            font-weight: 700;
            font-size: 1.65rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .doc-header .subtitle {
            font-size: 0.95rem;
            color: var(--muted);
            margin-top: 6px;
        }

        /* ---------- Form / control bar ---------- */
        .control-bar {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ccc;
        }
        .field { flex: 1; min-width: 200px; }
        .field label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .field select {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #888;
            border-radius: 2px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: #fff;
            color: var(--text);
        }
        .field select:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: 1px solid var(--accent);
            padding: 10px 24px;
            border-radius: 2px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover:not(:disabled) { background: #0e3d21; }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }

        .btn-outline {
            background: #fff;
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .btn-outline:hover:not(:disabled) { background: var(--accent-light); }

        /* ---------- Loading / Error ---------- */
        .loading { display: none; text-align: center; padding: 40px 0; color: var(--muted); }
        .loading-spinner {
            border: 2.5px solid #ddd;
            border-top: 2.5px solid var(--accent);
            border-radius: 50%;
            width: 30px; height: 30px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error {
            background: var(--error-bg);
            color: var(--error);
            border: 1px solid var(--error);
            padding: 12px 15px;
            border-radius: 2px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.92rem;
        }

        /* ---------- Results ---------- */
        .results { display: none; }

        .results-header {
            text-align: center;
            margin-bottom: 14px;
        }
        .results-header h2 {
            font-family: 'Noto Serif', serif;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .results-info {
            font-size: 0.9rem;
            color: var(--muted);
            margin-top: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--border);
        }
        th, td {
            border: 1px solid var(--border);
            padding: 9px 10px;
            text-align: center;
            font-size: 0.9rem;
        }
        th {
            background: #e9e9e9;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.78rem;
        }
        td:nth-child(2) { text-align: left; }

        tbody tr:nth-child(even) { background: #fafafa; }

        .total-row td {
            font-weight: 700;
            background: var(--accent-light);
        }

        .actions-row {
            display: flex;
            justify-content: center;
            margin-top: 22px;
        }

        .no-data {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        @media print {
            body { background: white; padding: 0; }
            .sheet { border: none; padding: 0; }
            .control-bar, .actions-row { display: none !important; }
            .results { display: block !important; }
        }

        @media (max-width: 640px) {
            .sheet { padding: 20px 16px; }
            .doc-header h1 { font-size: 1.3rem; }
            .control-bar { flex-direction: column; align-items: stretch; }
            table { font-size: 0.78rem; }
            th, td { padding: 7px 6px; }
        }
    </style>
</head>
<body>
    <div class="sheet">
        <header class="doc-header">
            <h1>School Wise Students Information</h1>
            <p class="subtitle">SSC - 2026 | Student Distribution Report</p>
        </header>

        <div class="control-bar">
            <div class="field">
                <label for="groupSelect">Select Group</label>
                <select id="groupSelect">
                    <option value="">Choose Group...</option>
                    <option value="HUMANITIES">Humanities</option>
                    <option value="SCIENCE">Science</option>
                    <option value="BUSINESS STUDIES">Business Studies</option>
                </select>
            </div>

            <div class="field">
                <label for="typeSelect">Select Type</label>
                <select id="typeSelect">
                    <option value="">Choose Type...</option>
                    <option value="REGULAR">Regular</option>
                    <option value="IRREGULAR">Irregular</option>
                </select>
            </div>

            <button class="btn" id="generateBtn" onclick="generateReport()">Generate Report</button>
        </div>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Loading student data...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <div class="results-header">
                <h2 id="resultsTitle">School Wise Students Information</h2>
                <p class="results-info" id="resultsInfo"></p>
            </div>
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>EIIN</th>
                        <th>School Name</th>
                        <th>Female Range</th>
                        <th>Female Total</th>
                        <th>Male Range</th>
                        <th>Male Total</th>
                        <th>Grand Total</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <div class="actions-row">
                <button class="btn btn-outline" onclick="printReport()">Print Report</button>
            </div>
        </div>
    </div>

    <script>
        // 👇 আপনার Apps Script Web App-এর Deployment URL
        const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyEpbWMPEvNmQo41Ob5FmGC7fhaOVUt7N7U2bfOCWitktTBtQ-mFGyD4na81Fe4fcHCMg/exec';

        function generateReport() {
            const group = document.getElementById('groupSelect').value;
            const type = document.getElementById('typeSelect').value;
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');
            const generateBtn = document.getElementById('generateBtn');

            if (!group || !type) {
                showError('Please select both Group and Type');
                return;
            }

            errorDiv.style.display = 'none';
            resultsDiv.style.display = 'none';
            loadingDiv.style.display = 'block';
            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating...';

            const url = `${WEBAPP_URL}?action=getData&group=${encodeURIComponent(group)}&type=${encodeURIComponent(type)}`;

            fetch(url)
                .then(response => response.json())
                .then(result => {
                    loadingDiv.style.display = 'none';
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Generate Report';

                    if (result.success) {
                        displayResults(result);
                    } else {
                        showError('Error: ' + result.error);
                    }
                })
                .catch(error => {
                    loadingDiv.style.display = 'none';
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Generate Report';
                    showError('Error: ' + error.message);
                });
        }

        function displayResults(result) {
            const resultsDiv = document.getElementById('results');
            const resultsTitle = document.getElementById('resultsTitle');
            const resultsInfo = document.getElementById('resultsInfo');
            const tableBody = document.getElementById('tableBody');

            resultsTitle.textContent = `School Wise Students Information - SSC 2026`;
            resultsInfo.textContent = `Group: ${result.group} | Type: ${result.type} (Auto-Detected)`;

            tableBody.innerHTML = '';

            if (result.data.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="no-data">
                            <p>No student data found for the selected criteria.</p>
                        </td>
                    </tr>
                `;
            } else {
                result.data.forEach(school => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${school.eiin}</td>
                        <td>${school.schoolName}</td>
                        <td>${school.femaleRange || '-'}</td>
                        <td>${school.femaleTotal}</td>
                        <td>${school.maleRange || '-'}</td>
                        <td>${school.maleTotal}</td>
                        <td><strong>${school.grandTotal}</strong></td>
                    `;
                    tableBody.appendChild(row);
                });

                const totalFemale = result.data.reduce((sum, school) => sum + school.femaleTotal, 0);
                const totalMale = result.data.reduce((sum, school) => sum + school.maleTotal, 0);
                const grandTotal = totalFemale + totalMale;

                const totalRow = document.createElement('tr');
                totalRow.className = 'total-row';
                totalRow.innerHTML = `
                    <td colspan="2">TOTAL</td>
                    <td>-</td>
                    <td>${totalFemale}</td>
                    <td>-</td>
                    <td>${totalMale}</td>
                    <td>${grandTotal}</td>
                `;
                tableBody.appendChild(totalRow);
            }

            resultsDiv.style.display = 'block';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function printReport() {
            window.print();
        }
    </script>
</body>
</html>
