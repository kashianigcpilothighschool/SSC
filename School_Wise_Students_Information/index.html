<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Wise Students Information</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: #2c3e50; font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { color: #7f8c8d; font-size: 1.1rem; margin-bottom: 30px; }

        .form-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: end;
        }

        .form-group { flex: 1; min-width: 200px; }
        .form-group label { display: block; margin-bottom: 8px; color: #34495e; font-weight: 600; }

        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 1rem;
            background: white;
            outline: none;
        }

        .form-group select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(102, 126, 234, 0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .loading { display: none; text-align: center; padding: 40px; }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            display: none;
        }

        .results { display: none; }

        .results-header {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }
        .results-header h2 { font-size: 1.5rem; margin-bottom: 10px; }
        .results-info { font-size: 1rem; opacity: 0.9; }

        .table-container {
            overflow-x: auto;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 15px 12px; text-align: left; border-bottom: 1px solid #e1e8ed; }
        th {
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        td { font-size: 0.95rem; color: #2c3e50; }
        tr:hover { background: rgba(102, 126, 234, 0.05); }

        .print-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            box-shadow: 0 8px 15px rgba(39, 174, 96, 0.3);
        }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 20px; background: white; }
            .form-container, .btn, .print-btn { display: none !important; }
            .results { display: block !important; }
            th { background: #34495e !important; -webkit-print-color-adjust: exact; color-adjust: exact; }
        }

        @media (max-width: 768px) {
            .container { padding: 20px; }
            .header h1 { font-size: 2rem; }
            .form-container { flex-direction: column; }
            .form-group { min-width: 100%; }
            table { font-size: 0.8rem; }
            th, td { padding: 10px 8px; }
        }

        .no-data { text-align: center; padding: 40px 20px; color: #7f8c8d; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏫 School Wise Students Information</h1>
            <p class="subtitle">SSC - 2026 | Student Distribution Report</p>
        </div>

        <div class="form-container">
            <div class="form-group">
                <label for="groupSelect">📚 Select Group:</label>
                <select id="groupSelect">
                    <option value="">Choose Group...</option>
                    <option value="HUMANITIES">Humanities</option>
                    <option value="SCIENCE">Science</option>
                    <option value="BUSINESS STUDIES">Business Studies</option>
                </select>
            </div>

            <div class="form-group">
                <label for="typeSelect">📋 Select Type:</label>
                <select id="typeSelect">
                    <option value="">Choose Type...</option>
                    <option value="REGULAR">Regular</option>
                    <option value="IRREGULAR">Irregular</option>
                </select>
            </div>

            <div class="form-group">
                <button class="btn" id="generateBtn" onclick="generateReport()">
                    ✨ Generate Report
                </button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Loading student data...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <div class="results-header">
                <h2 id="resultsTitle">School Wise Students Information</h2>
                <p class="results-info" id="resultsInfo"></p>
            </div>
            <div class="table-container">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>EIIN</th>
                            <th>School Name</th>
                            <th>Female Range</th>
                            <th>Female Total</th>
                            <th>Male Range</th>
                            <th>Male Total</th>
                            <th>Grand Total</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div style="text-align: center;">
                <button class="btn print-btn" onclick="printReport()">
                    🖨️ Print Report
                </button>
            </div>
        </div>
    </div>

    <script>
        // 👇 এখানে আপনার Apps Script Web App-এর Deployment URL বসান
        const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyAdSixNHQQuvu8PlxsIjg6Ei7ue9y_KFIyWiPp-040g-ofx6GxMFM612JD4FjezJ1V/exec';

        function generateReport() {
            const group = document.getElementById('groupSelect').value;
            const type = document.getElementById('typeSelect').value;
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');
            const generateBtn = document.getElementById('generateBtn');

            if (!group || !type) {
                showError('Please select both Group and Type');
                return;
            }

            errorDiv.style.display = 'none';
            resultsDiv.style.display = 'none';
            loadingDiv.style.display = 'block';
            generateBtn.disabled = true;
            generateBtn.textContent = '⏳ Generating...';

            const url = `${WEBAPP_URL}?action=getData&group=${encodeURIComponent(group)}&type=${encodeURIComponent(type)}`;

            fetch(url)
                .then(response => response.json())
                .then(result => {
                    loadingDiv.style.display = 'none';
                    generateBtn.disabled = false;
                    generateBtn.textContent = '✨ Generate Report';

                    if (result.success) {
                        displayResults(result);
                    } else {
                        showError('Error: ' + result.error);
                    }
                })
                .catch(error => {
                    loadingDiv.style.display = 'none';
                    generateBtn.disabled = false;
                    generateBtn.textContent = '✨ Generate Report';
                    showError('Error: ' + error.message);
                });
        }

        function displayResults(result) {
            const resultsDiv = document.getElementById('results');
            const resultsTitle = document.getElementById('resultsTitle');
            const resultsInfo = document.getElementById('resultsInfo');
            const tableBody = document.getElementById('tableBody');

            resultsTitle.textContent = `School Wise Students Information - SSC 2026`;
            resultsInfo.textContent = `Group: ${result.group} | Type: ${result.type} (Auto-Detected)`;

            tableBody.innerHTML = '';

            if (result.data.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="no-data">
                            <div>📊</div>
                            <p>No student data found for the selected criteria.</p>
                        </td>
                    </tr>
                `;
            } else {
                result.data.forEach(school => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${school.eiin}</td>
                        <td>${school.schoolName}</td>
                        <td>${school.femaleRange || '-'}</td>
                        <td>${school.femaleTotal}</td>
                        <td>${school.maleRange || '-'}</td>
                        <td>${school.maleTotal}</td>
                        <td><strong>${school.grandTotal}</strong></td>
                    `;
                    tableBody.appendChild(row);
                });

                const totalFemale = result.data.reduce((sum, school) => sum + school.femaleTotal, 0);
                const totalMale = result.data.reduce((sum, school) => sum + school.maleTotal, 0);
                const grandTotal = totalFemale + totalMale;

                const totalRow = document.createElement('tr');
                totalRow.style.fontWeight = 'bold';
                totalRow.style.backgroundColor = '#f8f9fa';
                totalRow.innerHTML = `
                    <td colspan="2"><strong>TOTAL</strong></td>
                    <td>-</td>
                    <td><strong>${totalFemale}</strong></td>
                    <td>-</td>
                    <td><strong>${totalMale}</strong></td>
                    <td><strong>${grandTotal}</strong></td>
                `;
                tableBody.appendChild(totalRow);
            }

            resultsDiv.style.display = 'block';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function printReport() {
            window.print();
        }
    </script>
</body>
</html>
