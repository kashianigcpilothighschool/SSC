<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পরীক্ষা কক্ষের তথ্য</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #16213E;
            --navy-dark: #0E1628;
            --navy-soft: #2A3A5F;
            --gold: #B8862B;
            --gold-soft: #E9D9AF;
            --paper: #F5F4EF;
            --surface: #FFFFFF;
            --border: #DDD8CB;
            --ink: #1B1F27;
            --ink-soft: #5B6472;
            --success: #2F7D4F;
            --success-bg: #E7F3EC;
            --error: #B03A2E;
            --error-bg: #FBEAE7;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Hind Siliguri', 'SolaimanLipi', 'Kalpurush', sans-serif;
            margin: 0;
            padding: 0 0 60px;
            background-color: var(--paper);
            color: var(--ink);
            line-height: 1.6;
        }

        .container {
            max-width: 880px;
            margin: 0 auto;
            background-color: var(--surface);
            border: 1px solid var(--border);
            box-shadow: 0 1px 3px rgba(22, 33, 62, 0.06);
        }

        /* ===== হেডার ব্যানার ===== */
        .header {
            background: var(--navy);
            padding: 34px 40px 28px;
            border-bottom: 4px solid var(--gold);
        }
        .header h1 {
            font-family: 'Noto Serif Bengali', serif;
            color: #fff;
            margin: 0 0 6px;
            font-size: 26px;
            font-weight: 600;
        }
        .header p {
            margin: 0;
            color: var(--gold-soft);
            font-size: 14px;
        }

        .body-pad { padding: 32px 40px 8px; }

        /* ===== সেকশন হেডিং (নাম্বারড, কারণ এটা প্রকৃত ধাপক্রম) ===== */
        .section-heading {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 36px 0 18px;
        }
        .section-heading:first-child { margin-top: 0; }
        .section-num {
            flex: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--navy);
            color: #fff;
            font-family: 'Noto Serif Bengali', serif;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .section-heading h3 {
            margin: 0;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--navy);
        }

        .room-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        .info-card {
            background-color: var(--paper);
            padding: 18px 20px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--gold);
        }
        .info-card h3 {
            display: none; /* শিরোনাম উপরের section-heading এ চলে গেছে */
        }
        .info-item {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .info-item:last-child { margin-bottom: 0; }
        .info-label {
            font-weight: 500;
            color: var(--ink-soft);
            font-size: 14px;
            white-space: nowrap;
        }
        .info-value {
            color: var(--ink);
            font-weight: 600;
        }

        .building-floor-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 10px;
        }
        .building-floor-item { display: flex; flex-direction: column; }
        .building-floor-item label {
            font-weight: 500;
            color: var(--ink-soft);
            font-size: 13px;
            margin-bottom: 6px;
        }

        /* ===== ইনপুট সাধারণ স্টাইল ===== */
        input[type="text"], input[type="number"], select {
            font-family: inherit;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
            color: var(--ink);
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--navy);
            box-shadow: 0 0 0 3px rgba(22, 33, 62, 0.1);
        }
        #roomNumber, #genderSelect, #departmentSelect, #benchCount,
        #buildingSelect, #floorSelect, #directionSelect {
            color: var(--navy) !important;
            font-weight: 600;
            border: 1px solid var(--border) !important;
            background-color: #fff !important;
        }

        #directionNote {
            padding: 10px 14px !important;
            background-color: var(--gold-soft) !important;
            border-radius: 4px;
            font-size: 12.5px;
            color: var(--navy-dark) !important;
            display: none;
            border: 1px solid var(--gold) !important;
        }
        #directionNote.show { display: block !important; }

        /* ===== বিদ্যালয়ের ফর্ম সেকশন ===== */
        .form-section {
            background-color: var(--paper);
            padding: 22px 24px;
            border: 1px solid var(--border);
        }
        .form-section h3 { display: none; }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 40px;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            padding: 12px;
            background-color: #fff;
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        .form-row select, .form-row input { width: 100%; }

        .student-count {
            background-color: var(--success-bg);
            color: var(--success);
            text-align: center;
            border-radius: 4px;
            font-weight: 700;
            padding: 9px 5px;
            border: 1px solid #cfe8d8;
        }

        .add-btn {
            background-color: #fff;
            color: var(--navy);
            border: 1.5px dashed var(--navy-soft);
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            font-size: 14px;
            margin: 14px 0 0;
            width: 100%;
            transition: background-color .15s ease;
        }
        .add-btn:hover { background-color: var(--gold-soft); }

        .remove-btn {
            background-color: transparent;
            color: var(--error);
            border: 1px solid #ecc;
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
        }
        .remove-btn:hover { background-color: var(--error-bg); }

        .total-students {
            background-color: var(--navy);
            color: #fff;
            padding: 16px;
            border-radius: 4px;
            text-align: center;
            margin: 22px 40px 0;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: .2px;
        }

        /* ===== সিট প্লান সেকশন ===== */
        .seat-plan-section {
            background: var(--navy-dark);
            padding: 34px 40px;
            margin-top: 34px;
            color: #fff;
        }
        .seat-plan-header { margin-bottom: 22px; }
        .seat-plan-header h2 {
            margin: 0 0 6px;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
        }
        .seat-plan-header p {
            margin: 0;
            color: var(--gold-soft);
            font-size: 14px;
        }

        .column-input {
            background: rgba(255, 255, 255, 0.05);
            padding: 18px 20px;
            border-radius: 6px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .column-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .column-label {
            font-weight: 600;
            color: #fff;
            font-size: 15px;
        }
        .add-range-btn {
            background: transparent;
            color: var(--gold-soft);
            border: 1px solid var(--gold);
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            transition: background .15s ease;
        }
        .add-range-btn:hover { background: rgba(184, 134, 43, 0.2); }

        .range-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .range-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
            min-width: 58px;
        }
        .input-group { display: flex; gap: 10px; align-items: center; flex: 1; }
        .input-wrapper { display: flex; flex-direction: column; align-items: center; }
        .input-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 5px;
            font-weight: 500;
        }
        .column-input input {
            width: 82px;
            padding: 7px 9px;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
            background: #fff !important;
            color: var(--ink) !important;
        }
        .remove-range-btn {
            background: transparent;
            color: #f0a89e;
            border: 1px solid rgba(240, 168, 158, 0.4);
            padding: 6px 9px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            min-width: 28px;
        }
        .remove-range-btn:hover { background: rgba(176, 58, 46, 0.2); }

        .submit-section {
            text-align: center;
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        .submit-btn {
            background: var(--gold);
            color: var(--navy-dark);
            border: none;
            padding: 14px 36px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            min-width: 220px;
            margin-right: 12px;
            transition: filter .15s ease, transform .1s ease;
        }
        .submit-btn:hover:not(:disabled) { filter: brightness(1.08); }
        .submit-btn:active:not(:disabled) { transform: translateY(1px); }
        .submit-btn:disabled {
            background: #5b6472;
            color: #cfd3da;
            cursor: not-allowed;
        }

        .test-btn {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 14px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }
        .test-btn:hover { background: rgba(255, 255, 255, 0.08); }

        .print-btn {
            background: transparent;
            color: var(--gold-soft);
            border: 1px solid var(--gold);
            padding: 14px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-left: 12px;
        }
        .print-btn:hover { background: rgba(184, 134, 43, 0.15); }

        @media print {
            body * { visibility: hidden; }
            .print-content, .print-content * { visibility: visible; }
            .print-content { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
            .container { box-shadow: none; margin: 0; border: none; max-width: none; }
            .seat-plan-section { background: white !important; color: black !important; padding: 20px; border: 2px solid #000; }
            .column-input { background: #f9f9f9 !important; border: 1px solid #333 !important; color: black !important; }
            .range-item { background: white !important; border: 1px solid #333 !important; color: black !important; }
        }

        .loading { display: none; text-align: center; padding: 20px; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 14px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .alert {
            padding: 13px 18px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 14px;
            display: none;
        }
        .alert-error { background: var(--error-bg); border: 1px solid #eecac4; color: var(--error); }
        .alert-success { background: var(--success-bg); border: 1px solid #c3e6cb; color: var(--success); }

        .debug-info {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            padding: 10px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.85);
            max-height: 200px;
            overflow-y: auto;
        }

        .test-data-display {
            background: rgba(255, 255, 255, 0.06);
            padding: 15px;
            margin-top: 15px;
            border-radius: 6px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
            white-space: pre-wrap;
            color: rgba(255, 255, 255, 0.85);
        }

        @media (max-width: 768px) {
            body { padding-bottom: 40px; }
            .header { padding: 24px 20px; }
            .body-pad { padding: 24px 20px 8px; }
            .room-info { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; gap: 8px; }
            .building-floor-row { grid-template-columns: 1fr; gap: 10px; }
            .seat-plan-section { padding: 24px 20px; }
            .total-students { margin: 22px 20px 0; }
            .submit-btn { min-width: 100%; margin-right: 0; margin-bottom: 10px; }
            .test-btn, .print-btn { width: 100%; margin-left: 0; margin-top: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>পরীক্ষা কক্ষের তথ্য</h1>
        </div>

        <div class="body-pad">

            <div class="section-heading">
                <span class="section-num">১</span>
                <h3>কক্ষ ও অবস্থানের তথ্য</h3>
            </div>

            <div class="room-info">
                <div class="info-card">
                    <div class="info-item">
                        <span class="info-label">কক্ষ নং:</span>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <input type="text" id="roomNumber" value="১" style="width: 55px; text-align: center;">
                            <select id="genderSelect">
                                <option value="বালক">বালক</option>
                                <option value="বালিকা">বালিকা</option>
                                <option value="বালক ও বালিকা">বালক ও বালিকা</option>
                            </select>
                        </div>
                    </div>
                    <div class="info-item">
                        <span class="info-label">বিভাগ:</span>
                        <select id="departmentSelect">
                            <option value="বিজ্ঞান">বিজ্ঞান</option>
                            <option value="মানবিক">মানবিক</option>
                            <option value="ব্যবসায় শিক্ষা">ব্যবসায় শিক্ষা</option>
                            <option value="বিজ্ঞান ও মানবিক">বিজ্ঞান ও মানবিক</option>
                            <option value="সকল বিভাগ">সকল বিভাগ</option>
                        </select>
                    </div>
                    <div class="info-item">
                        <span class="info-label">বেঞ্চের সংখ্যা:</span>
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <input type="number" id="benchCount" value="25" min="1" style="width: 70px; text-align: center;">
                            <span style="font-size: 13px; color: var(--ink-soft);">খানা</span>
                        </div>
                    </div>
                    <div class="info-item">
                        <span class="info-label">পরীক্ষার্থীর সংখ্যা:</span>
                        <span class="info-value" id="totalStudentsInfo">০ জন</span>
                    </div>
                </div>

                <div class="info-card">
                    <div class="building-floor-row">
                        <div class="building-floor-item">
                            <label>ভবন</label>
                            <select id="buildingSelect">
                                <option value="পশ্চিম পার্শ্বের ভবন">পশ্চিম পার্শ্বের ভবন</option>
                                <option value="পূর্ব পার্শ্বের ভবন">পূর্ব পার্শ্বের ভবন</option>
                                <option value="উত্তর পার্শ্বের ভবন">উত্তর পার্শ্বের ভবন</option>
                                <option value="দক্ষিণ পার্শ্বের ভবন">দক্ষিণ পার্শ্বের ভবন</option>
                                <option value="প্রধান ভবন">প্রধান ভবন</option>
                            </select>
                        </div>
                        <div class="building-floor-item">
                            <label>তলা</label>
                            <select id="floorSelect">
                                <option value=" নিচতলা"> নিচতলা</option>
                                <option value="২য় তলা" selected>২য় তলা</option>
                                <option value="৩য় তলা">৩য় তলা</option>
                                <option value="৪র্থ তলা">৪র্থ তলা</option>
                            </select>
                        </div>
                    </div>
                    <div class="building-floor-row" style="margin-top: 4px;">
                        <div class="building-floor-item">
                            <label>বসার দিক</label>
                            <select id="directionSelect" onchange="updateDirectionInfo()">
                                <option value="">নির্বাচন করুন</option>
                                <option value="উত্তর মুখী">উত্তর মুখী</option>
                                <option value="দক্ষিণ মুখী">দক্ষিণ মুখী</option>
                                <option value="পূর্ব মুখী">পূর্ব মুখী</option>
                                <option value="পশ্চিম মুখী">পশ্চিম মুখী</option>
                            </select>
                        </div>
                        <div id="directionNote">
                            <span id="directionNoteText"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section-heading">
                <span class="section-num">২</span>
                <h3>বিদ্যালয়ের নাম, রোল নম্বর ও শিক্ষার্থী সংখ্যা</h3>
            </div>

            <div class="form-section">
                <div id="schoolForms">
                    <div class="form-row">
                        <select class="school-select" onchange="updateTotal()">
                            <option value="">বিদ্যালয় নির্বাচন করুন</option>
                            <option value="জাটিগ্রাম মমতাজ উদ্দিন মেমোরিয়াল মাধ্যমিক বিদ্যালয়">জাটিগ্রাম মমতাজ উদ্দিন মেমোরিয়াল মাধ্যমিক বিদ্যালয়</option>
                            <option value="মালা শহীদ আসাদুজ্জামান উচ্চ বিদ্যালয়">মালা শহীদ আসাদুজ্জামান উচ্চ বিদ্যালয়</option>
                            <option value="পোনা এম এ খালেক উচ্চ বিদ্যালয়">পোনা এম এ খালেক উচ্চ বিদ্যালয়</option>
                            <option value="নায়েবুননেসা ইনস্টিটিউশন">নায়েবুননেসা ইনস্টিটিউশন</option>
                            <option value="ধানকোড়া উচ্চ বিদ্যালয়">ধানকোড়া উচ্চ বিদ্যালয়</option>
                            <option value="কাশিয়ানী গিরীশ চন্দ্র পাইলট উচ্চ বিদ্যালয়">কাশিয়ানী গিরীশ চন্দ্র পাইলট উচ্চ বিদ্যালয়</option>
                            <option value="জয়নগর মাধ্যমিক বিদ্যালয়">জয়নগর মাধ্যমিক বিদ্যালয়</option>

        function quickValidation() {
            const errors = [];

            if (!document.getElementById('roomNumber').value.trim()) {
                errors.push('কক্ষ নম্বর দিন');
            }

            if (!document.getElementById('directionSelect').value) {
                errors.push('বসার দিক নির্বাচন করুন');
            }

            const schoolRows = document.querySelectorAll('#schoolForms .form-row');
            let hasValidSchool = false;

            schoolRows.forEach(row => {
                const school = row.querySelector('.school-select').value;
                const startRoll = row.querySelector('.start-roll').value;
                const endRoll = row.querySelector('.end-roll').value;

                if (school && startRoll && endRoll) {
                    hasValidSchool = true;
                }
            });

            if (!hasValidSchool) {
                errors.push('অন্তত একটি বিদ্যালয়ের সম্পূর্ণ তথ্য দিন');
            }

            const columns = ['C', 'D', 'F', 'G', 'I', 'J'];
            let totalSeats = 0;

            columns.forEach(col => {
                const ranges = document.querySelectorAll(`#ranges_${col} .range-item`);
                ranges.forEach(range => {
                    const seatCount = parseInt(range.querySelector('input[id*="seat_count"]').value) || 0;
                    totalSeats += seatCount;
                });
            });

            if (totalSeats === 0) {
                errors.push('অন্তত একটি কলামে সিট সংখ্যা দিন');
            }

            return errors;
        }

        function fastGenerateSeatPlan() {

            const errors = quickValidation();
            if (errors.length > 0) {
                showAlert('ত্রুটি: ' + errors.join(', '), 'error');
                return;
            }

            if (!WEB_APP_URL || WEB_APP_URL.indexOf('এখানে') !== -1) {
                showAlert('WEB_APP_URL সেট করা হয়নি। কোডের উপরে সঠিক Web App URL বসান।', 'error');

            }

            const loadingDiv = document.getElementById('loadingDiv');
            const submitBtn = document.getElementById('submitBtn');

            loadingDiv.style.display = 'block';
            submitBtn.disabled = true;
            submitBtn.textContent = 'জমা হচ্ছে...';

            try {
                const allData = collectAllData();
                log('Apps Script Web App-এ fetch() দিয়ে পাঠানো হচ্ছে...', 'info');

                fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(allData)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('HTTP ত্রুটি: ' + response.status);
                    }
                    return response.json();
                })
                .then(result => {
                    loadingDiv.style.display = 'none';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'সিট প্লান তৈরি করুন';

                    if (result && result.success) {
                        showAlert('সিট প্লান সফলভাবে তৈরি হয়েছে!', 'success');
                        log('সফল: ' + JSON.stringify(result), 'success');
                    } else {
                        showAlert((result && result.message) || 'সমস্যা হয়েছে', 'error');
                        log('ব্যর্থ: ' + JSON.stringify(result), 'error');
                    }
                })
                .catch(error => {
                    loadingDiv.style.display = 'none';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'সিট প্লান তৈরি করুন';
                    showAlert('সার্ভার ত্রুটি: ' + error.message, 'error');
                    log('fetch ত্রুটি: ' + error.message, 'error');
                });

            } catch (error) {
                loadingDiv.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.textContent = 'সিট প্লান তৈরি করুন';
                showAlert('ত্রুটি: ' + error.message, 'error');
            }
        }

        function printPage() {
            log('প্রিন্ট ফাংশন চালু...', 'info');

            try {
                const container = document.querySelector('.container');

                hiddenElements.forEach(el => el.style.display = 'none');

                setTimeout(() => {
                    container.classList.remove('print-content');

        function handleRollInput(input, type) {
            const value = input.value;
            const row = input.parentElement;

            const numericValue = value.replace(/[^0-9]/g, '');

            if (numericValue.length > 6) {
                input.value = numericValue.substring(0, 6);
                return;
            }

            input.value = numericValue;

            if (numericValue.length === 6) {
                if (type === 'start') {
                    const endRollInput = row.querySelector('.end-roll');
                    if (endRollInput) {
                        setTimeout(() => {
                            endRollInput.focus();
                            endRollInput.select();
                        }, 100);
                    }
                } else if (type === 'end') {
                    const nextRow = row.parentElement.nextElementSibling;
                    if (nextRow && nextRow.classList.contains('form-row')) {
                        const nextSchoolSelect = nextRow.querySelector('.school-select');
                        if (nextSchoolSelect) {
                            setTimeout(() => {
                                nextSchoolSelect.focus();
                            }, 100);
                        }
                    } else {
                        addNewRow();
                        setTimeout(() => {
                            const newRows = document.querySelectorAll('#schoolForms .form-row');
                            const lastRow = newRows[newRows.length - 1];
                            const schoolSelect = lastRow.querySelector('.school-select');
                            if (schoolSelect) {
                                schoolSelect.focus();
                            }
                        }, 200);
                    }
                }

                if (navigator.vibrate) {
                    navigator.vibrate(50);
                }

                log(`${type === 'start' ? 'শুরুর' : 'শেষের'} রোল ৬ ডিজিট পূর্ণ হয়েছে: ${numericValue}`, 'info');
            }

            if (numericValue.length > 0) {
                const rollNumber = parseInt(numericValue);
                if (rollNumber < 100000) {
                    input.style.borderColor = '#c99a2e';
                } else {
                    input.style.borderColor = '#2F7D4F';
                }
            } else {
                input.style.borderColor = '';
            }

            updateStudentCount(row);
        }

        function handleKeyPress(event, input, type) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const value = input.value.replace(/[^0-9]/g, '');
                if (value.length >= 5) {
                    handleRollInput(input, type);
                }
            }

            if (event.key === 'Tab' && input.value.length === 6) {
                log('Tab key pressed with complete 6-digit roll', 'info');
            }

            const allowedKeys = ['Backspace', 'Delete', 'Tab', 'Enter', 'ArrowLeft', 'ArrowRight'];
            if (!allowedKeys.includes(event.key) && (event.key < '0' || event.key > '9')) {
                event.preventDefault();
            }
        }

            const selectedDirection = directionSelect.value;

            compassDirections.forEach(compass => {
                compass.classList.remove('active');

                    compass.classList.add('active');

            if (selectedDirection) {
                const notes = {

                    'দক্ষিণ মুখী': '🔻 পরীক্ষার্থীরা দক্ষিণ দিকে মুখ করে বসবেন। এই দিকে সূর্যের আলো ভালো পাওয়া যায়।',
                    'পূর্ব মুখী': '▶ পরীক্ষার্থীরা পূর্ব দিকে মুখ করে বসবেন। সকালের সূর্যের আলো এই দিকে আসে।',
                    'পশ্চিম মুখী': '◀ পরীক্ষার্থীরা পশ্চিম দিকে মুখ করে বসবেন। বিকালে এই দিকে রোদ থাকে।',
                    'উত্তর-পূর্ব মুখী': '↗ পরীক্ষার্থীরা উত্তর-পূর্ব কোণের দিকে মুখ করে বসবেন।',
                    'উত্তর-পশ্চিম মুখী': '↖ পরীক্ষার্থীরা উত্তর-পশ্চিম কোণের দিকে মুখ করে বসবেন।',
                    'দক্ষিণ-পূর্ব মুখী': '↘ পরীক্ষার্থীরা দক্ষিণ-পূর্ব কোণের দিকে মুখ করে বসবেন।',
                    'দক্ষিণ-পশ্চিম মুখী': '↙ পরীক্ষার্থীরা দক্ষিণ-পশ্চিম কোণের দিকে মুখ করে বসবেন।'
                };

                directionNoteText.innerHTML = notes[selectedDirection];
                directionNote.classList.add('show');
                log(`দিক নির্বাচন: ${selectedDirection}`, 'info');
            } else {
                directionNote.classList.remove('show');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const compassDirections = document.querySelectorAll('.compass-direction[data-direction]');
            compassDirections.forEach(compass => {
                compass.addEventListener('click', function() {
                    const direction = this.getAttribute('data-direction');

                    updateDirectionInfo();
                });
            });

        function calculateStudents(startRoll, endRoll) {
            if (startRoll && endRoll && !isNaN(startRoll) && !isNaN(endRoll)) {
                return Math.max(0, parseInt(endRoll) - parseInt(startRoll) + 1);
            }
            return 0;
        }

        function updateStudentCount(row) {
            const startRoll = row.querySelector('.start-roll').value;
            const endRoll = row.querySelector('.end-roll').value;
            const studentCount = calculateStudents(startRoll, endRoll);
            row.querySelector('.student-count').textContent = studentCount;
            updateTotal();
        }

        function updateTotal() {
            let total = 0;

            const formRows = document.querySelectorAll('#schoolForms .form-row');
            formRows.forEach(row => {
                const schoolName = row.querySelector('.school-select').value;
                const startRoll = row.querySelector('.start-roll').value;
                const endRoll = row.querySelector('.end-roll').value;

                if (schoolName && startRoll && endRoll) {
                    const students = calculateStudents(startRoll, endRoll);
                    total += students;
                }
            });

            document.getElementById('totalStudents').textContent = `মোট পরীক্ষার্থী: ${total} জন`;
            document.getElementById('totalStudentsInfo').textContent = `${total} জন`;
        }

                        <option value="মালা শহীদ আসাদুজ্জামান উচ্চ বিদ্যালয়">মালা শহীদ আসাদুজ্জামান উচ্চ বিদ্যালয়</option>
                        <option value="পোনা এম এ খালেক উচ্চ বিদ্যালয়">পোনা এম এ খালেক উচ্চ বিদ্যালয়</option>
                        <option value="নায়েবুননেসা ইনস্টিটিউশন">নায়েবুননেসা ইনস্টিটিউশন</option>
                        <option value="ধানকোড়া উচ্চ বিদ্যালয়">ধানকোড়া উচ্চ বিদ্যালয়</option>
                        <option value="কাশিয়ানী গিরীশ চন্দ্র পাইলট উচ্চ বিদ্যালয়">কাশিয়ানী গিরীশ চন্দ্র পাইলট উচ্চ বিদ্যালয়</option>
                        <option value="জয়নগর মাধ্যমিক বিদ্যালয়">জয়নগর মাধ্যমিক বিদ্যালয়</option>
                        <option value="জয়নগর মাধ্যমিক বালিকা বিদ্যালয়">জয়নগর মাধ্যমিক বালিকা বিদ্যালয়</option>
                        <option value="ভাটিয়াপাড়া উচ্চ বিদ্যালয়">ভাটিয়াপাড়া উচ্চ বিদ্যালয়</option>
                        <option value="এম.এ.খালেক সরকারি বালিকা উচ্চ বিদ্যালয়">এম.এ.খালেক সরকারি বালিকা উচ্চ বিদ্যালয়</option>
                        <option value="চরভাটপাড়া উচ্চ বিদ্যালয়">চরভাটপাড়া উচ্চ বিদ্যালয়</option>
                         <option value="সাজাইল গোপীমোহন উচ্চ বিদ্যালয়">সাজাইল গোপীমোহন উচ্চ বিদ্যালয়</option>
                          <option value="রামদিয়া শ্রীকৃষ্ণ শশী কমল বিদ্যাপীঠ">রামদিয়া শ্রীকৃষ্ণ শশী কমল বিদ্যাপীঠ</option>
                        <option value="আলহাজ্ব আব্দুল গণি উচ্চ বিদ্যালয়">আলহাজ্ব আব্দুল গণি উচ্চ বিদ্যালয়</option>
                </select>
                <input type="number" placeholder="শুরুর রোল" class="start-roll" min="1" maxlength="6" oninput="handleRollInput(this, 'start')" onkeydown="handleKeyPress(event, this, 'start')">
                <input type="number" placeholder="শেষের রোল" class="end-roll" min="1" maxlength="6" oninput="handleRollInput(this, 'end')" onkeydown="handleKeyPress(event, this, 'end')">
                <div class="student-count">০</div>
                <button type="button" class="remove-btn" onclick="removeRow(this)" title="সরান">✕</button>

            schoolForms.appendChild(newRow);
            log('নতুন বিদ্যালয়ের সারি যোগ করা হয়েছে');
        }

        function removeRow(button) {
            const row = button.parentElement;
            row.remove();
            updateTotal();
            log('বিদ্যালয়ের সারি সরানো হয়েছে');
        }

        document.addEventListener('DOMContentLoaded', function() {
            log('HTML পেজ লোড হয়েছে', 'success');

            const columns = ['C', 'D', 'F', 'G', 'I', 'J'];
            const columnLabels = {
                'C': 'বাম পার্শ্ব (ওয়াল)',
                'D': 'বাম পার্শ্ব (রোড)',
                'F': 'মধ্য (বাম)',
                'G': 'মধ্য (ডান)',
                'I': 'ডান পার্শ্ব (রোড)',
                'J': 'ডান পার্শ্ব (ওয়াল)'
            };
            const container = document.getElementById('columnInputs');

            columns.forEach((col) => {
                rangeCounters[col] = 1;

                const div = document.createElement('div');
                div.className = 'column-input';
                div.id = 'column_' + col;

                const labelText = columnLabels[col] || ('কলাম ' + col);

                div.innerHTML = `
                    <div class="column-header">
                        <span class="column-label">${labelText}: (ক্রমানুসারে সাজানো)</span>
                        <button type="button" class="add-range-btn" onclick="addRange('${col}')">+ রেঞ্জ যোগ করুন</button>
                    </div>
                    <div id="ranges_${col}"></div>
                `;

                container.appendChild(div);
                addRange(col);
            });

            const existingInputs = document.querySelectorAll('.start-roll, .end-roll');
            existingInputs.forEach(input => {
                const type = input.classList.contains('start-roll') ? 'start' : 'end';
                input.setAttribute('onkeydown', `handleKeyPress(event, this, '${type}')`);
            });

            updateTotal();
            log('ফর্ম ইনিশিয়ালাইজ সম্পন্ন', 'success');
        });

        function addRange(col) {
            const container = document.getElementById('ranges_' + col);
            const rangeDiv = document.createElement('div');
            rangeDiv.className = 'range-item';
            rangeDiv.id = 'range_' + col + '_' + rangeCounters[col];

            rangeDiv.innerHTML = `
    <span class="range-label">রেঞ্জ ${container.children.length + 1}:</span>
    <div class="input-group">

        <div class="input-wrapper">
            <div class="input-label">শুরুর রোল</div>
            <input type="text" maxlength="6"
                id="start_roll_${col}_${rangeCounters[col]}"
                oninput="updateEndRoll('${col}', '${rangeCounters[col]}')" />
        </div>

        <div class="input-wrapper">
            <div class="input-label">সিট সংখ্যা</div>
            <input type="number"
                id="seat_count_${col}_${rangeCounters[col]}"
                oninput="updateEndRoll('${col}', '${rangeCounters[col]}')" />
        </div>

        <div class="input-wrapper">
            <div class="input-label">শেষ রোল</div>
            <input type="text"
                id="end_roll_${col}_${rangeCounters[col]}"
                readonly />
        </div>

    </div>

    <button type="button" class="remove-range-btn"
        onclick="removeRange('${col}', '${rangeCounters[col]}')">-</button>
`;

            container.appendChild(rangeDiv);
            rangeCounters[col]++;
            updateRangeLabels(col);
            log(`কলাম ${col} এ নতুন রেঞ্জ যোগ করা হয়েছে`);
        }

        function removeRange(col, id) {
            const container = document.getElementById('ranges_' + col);
            const rangeDiv = document.getElementById('range_' + col + '_' + id);

            if (container.children.length <= 1) {
                showAlert('অন্তত একটি রেঞ্জ থাকতে হবে!', 'error');
                return;
            }

            container.removeChild(rangeDiv);
            updateRangeLabels(col);
            log(`কলাম ${col} থেকে রেঞ্জ সরানো হয়েছে`);
        }

        function updateRangeLabels(col) {
            const container = document.getElementById('ranges_' + col);
            const ranges = container.children;

            for (let i = 0; i < ranges.length; i++) {
                const label = ranges[i].querySelector('.range-label');
                label.textContent = 'রেঞ্জ ' + (i + 1) + ':';
            }
        }

        function showAlert(message, type) {
            const alertDiv = document.getElementById(type + 'Alert');
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 5000);
            log(message, type);
        }

        function collectAllData() {
            log('সকল ডেটা সংগ্রহ করা শুরু...');

            const roomData = {
                roomNumber: document.getElementById('roomNumber').value.trim(),
                gender: document.getElementById('genderSelect').value,
                department: document.getElementById('departmentSelect').value,
                building: document.getElementById('buildingSelect').value,
                floor: document.getElementById('floorSelect').value,
                benchCount: parseInt(document.getElementById('benchCount').value),
                direction: document.getElementById('directionSelect').value || 'নির্বাচিত নয়'
            };
            log(`রুম তথ্য: ${roomData.roomNumber} নম্বর কক্ষ, ${roomData.gender}, ${roomData.department}, ভবন: ${roomData.building}, তলা: ${roomData.floor}, বসার দিক: ${roomData.direction}`);

            if (!roomData.direction || roomData.direction === 'নির্বাচিত নয়') {
                log('সতর্কতা: বসার দিক নির্বাচন করা হয়নি', 'warning');
                showAlert('বসার দিক নির্বাচন করুন!', 'error');
            }
            const schoolData = [];
            const formRows = document.querySelectorAll('#schoolForms .form-row');
            formRows.forEach((row, index) => {
                const schoolName = row.querySelector('.school-select').value;
                const startRoll = parseInt(row.querySelector('.start-roll').value);
                const endRoll = parseInt(row.querySelector('.end-roll').value);

                if (schoolName && startRoll && endRoll && startRoll <= endRoll) {
                    const studentCount = endRoll - startRoll + 1;
                    schoolData.push({
                        id: index + 1,
                        name: schoolName,
                        startRoll: startRoll,
                        endRoll: endRoll,
                        studentCount: studentCount
                    });
                    log(`বিদ্যালয় ${index + 1}: ${schoolName} - ${startRoll} থেকে ${endRoll} (${studentCount} জন)`);
                }
            });

            const columns = ['C', 'D', 'F', 'G', 'I', 'J'];
            const columnData = [];

            for (let i = 0; i < columns.length; i++) {
                const col = columns[i];
                const rangeContainer = document.getElementById('ranges_' + col);

                if (!rangeContainer) {
                    log(`কলাম ${col} এর রেঞ্জ কন্টেইনার পাওয়া যায়নি`, 'error');
                    continue;
                }

                const ranges = rangeContainer.children;
                const colRanges = [];

                for (let j = 0; j < ranges.length; j++) {
                    const rangeDiv = ranges[j];
                    const startRollInput = rangeDiv.querySelector('input[id^="start_roll_' + col + '_"]');
                    const seatCountInput = rangeDiv.querySelector('input[id^="seat_count_' + col + '_"]');

                    if (!startRollInput || !seatCountInput) {
                        log(`কলাম ${col} রেঞ্জ ${j + 1} এর ইনপুট পাওয়া যায়নি`, 'error');
                        continue;
                    }

                    const startRoll = parseInt(startRollInput.value);
                    const seatCount = parseInt(seatCountInput.value);

                    if (!isNaN(seatCount) && seatCount > 0) {
                        colRanges.push({
                            startRoll: isNaN(startRoll) ? 0 : startRoll,
                            count: seatCount
                        });
                        log(`কলাম ${col} রেঞ্জ ${j + 1}: ${startRoll} থেকে ${seatCount} টি সিট`);
                    }
                }

                columnData.push({ ranges: colRanges });
            }

            const totalStudents = schoolData.reduce((sum, school) => sum + school.studentCount, 0);
            const totalSeats = columnData.reduce((sum, col) =>
                sum + col.ranges.reduce((colSum, range) => colSum + range.count, 0), 0
            );

            const allData = {
                roomInfo: roomData,
                schools: schoolData,
                columnData: columnData,
                totals: {
                    totalStudents: totalStudents,
                    totalSeats: totalSeats
                },
                token: sessionToken
            };

            log(`ডেটা সংগ্রহ সম্পন্ন - মোট ${totalStudents} জন ছাত্র, ${totalSeats} টি সিট`, 'success');
            return allData;
        }

        function testDataCollection() {
            log('ডেটা সংগ্রহ পরীক্ষা শুরু...', 'info');

            try {
                const allData = collectAllData();
                const displayDiv = document.getElementById('testDataDisplay');
                displayDiv.textContent = JSON.stringify(allData, null, 2);
                displayDiv.style.display = 'block';

                showAlert('ডেটা সংগ্রহ সফল! নিচে দেখুন।', 'success');
                log('ডেটা পরীক্ষা সফল', 'success');

            } catch (error) {
                log(`ডেটা পরীক্ষায় ত্রুটি: ${error.message}`, 'error');
                showAlert('ডেটা সংগ্রহে সমস্যা: ' + error.message, 'error');
            }
        }

        function generateSeatPlan() {
            fastGenerateSeatPlan();
        }

        log('স্ক্রিপ্ট লোড হয়েছে', 'success');

        function updateEndRoll(col, id) {
            const startEl = document.getElementById('start_roll_' + col + '_' + id);
            const seatEl = document.getElementById('seat_count_' + col + '_' + id);
            const endEl = document.getElementById('end_roll_' + col + '_' + id);

            const start = parseInt(startEl.value);
            const seat = parseInt(seatEl.value);

            if (!isNaN(start) && !isNaN(seat) && seat > 0) {
                endEl.value = start + seat - 1;
            } else {
                endEl.value = '';
            }
        }
    </script>
